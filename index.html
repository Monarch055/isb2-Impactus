<!DOCTYPE html>
<!-- Mendeklarasikan bahwa dokumen ini menggunakan standar HTML5 -->
<html lang="id">
<!-- Tag pembuka HTML dan menetapkan bahasa utama halaman ke Bahasa Indonesia -->

<head>
  <!-- Informasi meta dan pengaturan dokumen -->
  <meta charset="UTF-8">
  <!-- Encoding karakter universal (UTF-8) untuk mendukung semua simbol dan karakter -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Wajib ada agar tampilan responsif di layar HP (Mobile) maupun Laptop (Desktop) -->

  <!-- Judul Halaman di tab browser -->
  <title>Tugas Kelompok - Kerangka CSS Grid & Tailwind CSS</title>

  <!-- ========================================================================= -->
  <!-- 1. TAILWIND CSS PLAY CDN                                                  -->
  <!-- Peserta langsung bisa menggunakan semua class Tailwind CSS tanpa instalasi! -->
  <!-- ========================================================================= -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ========================================================================= -->
  <!-- 2. KERANGKA CSS GRID (Wadah Utama Layout Kelompok)                         -->
  <!-- Menggunakan CSS Grid murni untuk mengatur susunan slot kartu anggota     -->
  <!-- ========================================================================= -->
  <style>
    /* Reset dasar margin dan padding */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* KONTAINER UTAMA DENGAN CSS GRID */
    .grid-container {
      display: grid;              /* Mengaktifkan sistem layout CSS Grid */
      grid-template-columns: 1fr; /* Default Mobile: 1 kolom vertikal agar rapi di HP */
      gap: 1.25rem;               /* Jarak/celah antar kartu (20px) */
      width: 100%;
      max-width: 1700px;          /* Batas maksimal lebar layout agar 5 kartu leluasa */
      margin: 0 auto;             /* Memposisikan kontainer tepat di tengah halaman */
    }

    /* TAMPILAN DESKTOP / TABLET (Layar dengan lebar minimal 768px) */
    @media (min-width: 768px) {
      .grid-container {
        /* 5 Kolom berjajar dalam 1 baris lurus (tidak terbagi 2 baris) */
        grid-template-columns: repeat(5, 1fr);
      }

      /* Semua 5 slot kartu memiliki ukuran yang sama persis (masing-masing 1 kolom) */
      .slot-a, .slot-b, .slot-c, .slot-d, .slot-e {
        grid-column: span 1;
      }
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen p-4 sm:p-8 font-sans">

  <!-- ========================================================================= -->
  <!-- HEADER / JUDUL HALAMAN KELOMPOK (Semantic HTML: <header>)                 -->
  <!-- ========================================================================= -->
  <header class="text-center max-w-3xl mx-auto mb-8">
    <h1 class="text-3xl sm:text-4xl font-extrabold text-indigo-700 tracking-tight">
      Tim Impactus
    </h1>
  </header>

  <!-- ========================================================================= -->
  <!-- AREA UTAMA DENGAN CSS GRID (Semantic HTML: <main>)                        -->
  <!-- ========================================================================= -->
  <main class="grid-container">

    <!-- ===================================================================== -->
    <!-- SLOT A: [NAMA ANGGOTA 1]                                              -->
    <!-- Kerjakan desain kartumu di dalam tag <article> ini                   -->
    <!-- ===================================================================== -->
    <article id="slot-a" class="slot-a border-2 border-dashed border-slate-300 rounded-xl min-h-[700px] flex items-center justify-center text-slate-400 text-lg font-semibold">
      Slot A
    </article>


    <!-- ===================================================================== -->
    <!-- SLOT B: [NAMA ANGGOTA 2]                                              -->
    <!-- Kerjakan desain kartumu di dalam tag <article> ini                   -->
    <!-- ===================================================================== -->
    <article id="slot-b" class="slot-b border-2 border-dashed border-slate-300 rounded-xl min-h-[700px] flex items-center justify-center text-slate-400 text-lg font-semibold">
      Slot B
    </article>


    <!-- ===================================================================== -->
    <!-- SLOT C: [NAMA ANGGOTA 3]                                              -->
    <!-- Kerjakan desain kartumu di dalam tag <article> ini                   -->
    <!-- ===================================================================== -->
    <article id="slot-c" class="slot-c border-2 border-dashed border-slate-300 rounded-xl min-h-[700px] flex items-center justify-center text-slate-400 text-lg font-semibold">
      Slot C
    </article>


    <!-- ===================================================================== -->
    <!-- SLOT D: [NAMA ANGGOTA 4]                                              -->
    <!-- Kerjakan desain kartumu di dalam tag <article> ini                   -->
    <!-- ===================================================================== -->
    <article id="slot-d" class="slot-d border-2 border-dashed border-slate-300 rounded-xl min-h-[700px] flex items-center justify-center text-slate-400 text-lg font-semibold">
      Slot D
    </article>


    <!-- ===================================================================== -->
    <!-- SLOT E: [NAMA ANGGOTA 5]                                              -->
    <!-- Kerjakan desain kartumu di dalam tag <article> ini                   -->
    <!-- ===================================================================== -->
    <article id="slot-e" class="slot-e border-2 border-dashed border-slate-300 rounded-xl min-h-[700px] flex items-center justify-center text-slate-400 text-lg font-semibold">
      Slot E
    </article>

  </main>
  <!-- Akhir dari area utama .grid-container -->

  <!-- ========================================================================= -->
  <!-- FOOTER (Semantic HTML: <footer>)                                          -->
  <!-- ========================================================================= -->
  <footer class="text-center text-xs text-slate-400 mt-12 py-4">
    &copy; Bootcamp ISB 2 - Tugas Kolaborasi Git & Web
  </footer>

</body>

</html>
